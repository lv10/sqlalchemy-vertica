[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlalchemy-vertica"
version = "1.0.0"
description = "Vertica dialect for SQLAlchemy 2.0+ with Async & Alembic support"
readme = "README.rst"
license = "MIT"
authors = [
    {name = "Luis Villamarin", email = "luis@lv10.me"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0.0",
    "typing_extensions>=4.6.0",
]

[project.optional-dependencies]
vertica-python = [
    "vertica-python>=1.0.0",
]
asyncio = [
    "vertica-python>=1.0.0",
    "greenlet>=3.0.0",
]
pyodbc = [
    "pyodbc>=4.0.35",
]
turbodbc = [
    "turbodbc>=4.0.0",
]
alembic = [
    "alembic>=1.11.0",
]
all = [
    "vertica-python>=1.0.0",
    "greenlet>=3.0.0",
    "pyodbc>=4.0.35",
    "turbodbc>=4.0.0",
    "alembic>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/lv10/sqlalchemy-vertica"
Documentation = "https://github.com/lv10/sqlalchemy-vertica#readme"
Repository = "https://github.com/lv10/sqlalchemy-vertica"
Issues = "https://github.com/lv10/sqlalchemy-vertica/issues"
Funding = "https://buymeacoffee.com/luisvillamg"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "coverage[toml]>=7.3.0",
    "ruff>=0.9.0",
    "mypy>=1.5.0",
    "python-semantic-release>=9.15.2",
]

[project.entry-points."sqlalchemy.dialects"]
vertica = "sqlalchemy_vertica.dialect_vertica_python:VerticaDialect"
"vertica.vertica_python" = "sqlalchemy_vertica.dialect_vertica_python:VerticaDialect"
"vertica.vertica_python_async" = "sqlalchemy_vertica.dialect_vertica_python_async:VerticaDialect_vertica_python_async"
"vertica.async_vertica_python" = "sqlalchemy_vertica.dialect_vertica_python_async:VerticaDialect_vertica_python_async"
"vertica.pyodbc" = "sqlalchemy_vertica.dialect_pyodbc:VerticaDialect"
"vertica.turbodbc" = "sqlalchemy_vertica.dialect_turbodbc:VerticaDialect"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqlalchemy_vertica*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --cov=sqlalchemy_vertica --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["sqlalchemy_vertica"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["sqlalchemy_vertica/__init__.py:__version__"]
tag_format = "{version}"
build_command = "uv build"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
